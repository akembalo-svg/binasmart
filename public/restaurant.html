<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu · Scan, order, eat | BinaSmart Restaurants</title>
<meta name="description" content="The restaurant's own menu: scan the QR on your table, choose, and your order goes straight to the kitchen. Pay at the table. No app needed.">
<meta name="theme-color" content="#00704A">
<link rel="icon" href="/icon-32.png">
<link rel="stylesheet" href="/static/fonts/fonts.css?v=2">
<script>document.documentElement.classList.add('js')</script>
<style>
/* A restaurant's own ordering page (30 Sep 2026): only the restaurant, nothing else of BinaSmart but a small credit.
   Patterns from the apps people already know (Uber Eats rows and + buttons, Deliveroo sticky tabs and order bar,
   Starbucks green, Toast table ordering, Zomato info chips), in BinaSmart's own green and type. */
:root{--g:#00704A;--g2:#009688;--g3:#00C896;--mint:#e8f6f0;--ink:#081120;--mut:#667085;--bg:#f5f7f6;--line:#e6ecea;--amber:#b45309}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans Ethiopic',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:110px;-webkit-font-smoothing:antialiased}
.am{font-family:'Noto Sans Ethiopic','Inter',sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.w{max-width:720px;margin:0 auto}
/* cover: green, with the menu's own food drifting slowly behind */
.cover{position:relative;height:210px;overflow:hidden;background:radial-gradient(120% 90% at 10% 0%,#00C896 0%,rgba(0,200,150,0) 55%),linear-gradient(135deg,#00704A 0%,#005c3d 55%,#081120 140%)}
.cover .fl{position:absolute;inset:-40px;display:flex;flex-wrap:wrap;gap:34px;font-size:34px;opacity:.16;transform:rotate(-12deg);animation:float 26s linear infinite}
@keyframes float{to{transform:rotate(-12deg) translateY(-96px)}}
.cover .top{position:relative;display:flex;align-items:center;gap:10px;padding:14px 16px;color:#fff}
.cover .top .tb{margin-left:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;display:none}
.cover .top .tb.on{display:inline-flex;align-items:center;gap:6px}
.lang{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:#fff}
/* the restaurant card lies over the cover */
.card{position:relative;margin:-64px 14px 0;background:#fff;border-radius:24px;padding:20px 18px 18px;box-shadow:0 1px 2px rgba(8,17,32,.05),0 16px 40px rgba(8,17,32,.10)}
.card .lg{width:64px;height:64px;border-radius:18px;margin-top:-52px;background:linear-gradient(135deg,var(--g3),var(--g));display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px;border:4px solid #fff;box-shadow:0 8px 20px rgba(0,112,74,.3)}
.card h1{font-size:26px;letter-spacing:-.03em;line-height:1.15;margin-top:10px}
.card .an{font-size:16px;color:var(--g);font-weight:700;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips>span{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:#344054}
.chips>.tbl{background:var(--mint);border-color:#bfe6d6;color:var(--g)}
.demo{margin:14px 14px 0;padding:13px 15px;border-radius:18px;background:#fff7e6;border:1px solid #f6d58b;color:#7c4a03;font-size:13px;line-height:1.5;display:none}
.demo b{display:block;font-size:13.5px;margin-bottom:2px}.demo.on{display:block}
/* sticky: search + category tabs */
.bar{position:sticky;top:0;z-index:30;background:rgba(245,247,246,.97);padding:10px 14px 0;border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.bar.stuck{border-color:var(--line);box-shadow:0 6px 18px rgba(8,17,32,.06)}
.bar .mini{display:none;font-weight:800;font-size:15px;padding:2px 2px 8px}.bar.stuck .mini{display:block}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:transparent;color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 10px}.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:700;color:#475467;background:#fff;border:1px solid var(--line);transition:.2s}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* menu */
.sec{padding:14px 14px 4px;scroll-margin-top:120px}
.sec h2{font-size:20px;letter-spacing:-.02em;margin:6px 2px 10px}
.it{display:flex;gap:14px;align-items:stretch;background:#fff;border-radius:20px;padding:14px;margin-bottom:10px;border:1px solid var(--line);transition:transform .25s,box-shadow .25s;cursor:pointer}
.it:active{transform:scale(.99)}
.it .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.it .nm{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.3}
.it .na{font-size:13.5px;color:var(--mut);margin-top:1px}
.it .ds{font-size:13.5px;color:var(--mut);margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .pr{margin-top:auto;padding-top:8px;font-weight:800;font-size:15.5px}
.th{position:relative;width:104px;height:104px;flex-shrink:0;border-radius:16px;overflow:visible}
.th .im{width:100%;height:100%;border-radius:16px;display:grid;place-items:center;font-size:46px;overflow:hidden}
.th .im img{width:100%;height:100%;object-fit:cover}
.th .add{position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;background:#fff;color:var(--g);font-size:22px;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 12px rgba(8,17,32,.18);border:1px solid var(--line);transition:transform .2s}
.th .add.q{background:var(--g);color:#fff;border-color:var(--g);font-size:15px;font-weight:800}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{40%{transform:scale(1.25)}}
.none{text-align:center;color:var(--mut);padding:30px 0}
.skel{height:132px;border-radius:20px;margin:10px 14px;background:linear-gradient(90deg,#e9eeec 25%,#f4f7f6 50%,#e9eeec 75%);background-size:200% 100%;animation:sk 1.3s linear infinite}@keyframes sk{to{background-position:-200% 0}}
/* order bar */
.ob{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 14px calc(12px + env(safe-area-inset-bottom));transform:translateY(130%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.ob.on{transform:none}
.ob button{width:100%;max-width:692px;margin:0 auto;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--g),#005c3d);color:#fff;border-radius:18px;padding:16px 18px;font-weight:800;font-size:16px;box-shadow:0 14px 34px -10px rgba(0,112,74,.55)}
.ob .n{background:rgba(255,255,255,.2);border-radius:10px;min-width:30px;height:30px;display:grid;place-items:center;font-size:14px}
.ob .t{margin-left:auto}
/* sheets */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,17,32,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:720px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;max-height:90vh;overflow-y:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sh.on{transform:none}
.sh .grab{width:40px;height:5px;border-radius:3px;background:#d0d5dd;margin:10px auto 0}
.sh .in{padding:14px 20px 22px}
.sh .hero{height:190px;border-radius:20px;display:grid;place-items:center;font-size:92px;overflow:hidden;margin-bottom:16px}
.sh .hero img{width:100%;height:100%;object-fit:cover}
.sh h3{font-size:22px;letter-spacing:-.02em}
.sh .sa{color:var(--mut);margin-top:2px}.sh .sd{color:#475467;margin-top:10px;line-height:1.5;font-size:15px}
.sh .sp{font-size:20px;font-weight:800;margin-top:12px}
.step{display:flex;align-items:center;gap:18px;justify-content:center;margin:18px 0 6px}
.step button{width:44px;height:44px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:22px;font-weight:700}
.step b{font-size:20px;min-width:24px;text-align:center}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.inp{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink);outline:0}
.inp:focus{border-color:var(--g);background:#fff}
.go{width:100%;margin-top:18px;border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--g),#005c3d);color:#fff;font-weight:800;font-size:16px;box-shadow:0 12px 28px -12px rgba(0,112,74,.6)}
.go:disabled{opacity:.6}
.ln{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ln .e{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0;overflow:hidden}.ln .e img{width:100%;height:100%;object-fit:cover}
.ln .x{flex:1;min-width:0}.ln .x b{display:block;font-size:15px}.ln .x small{color:var(--mut)}
.ln .s{display:flex;align-items:center;gap:8px}.ln .s button{width:30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:17px;font-weight:700}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--mint);border-radius:16px;padding:14px 16px;margin-top:16px;font-weight:800;font-size:16px}.tot b{color:var(--g);font-size:19px}
.done{text-align:center;padding:10px 0 6px}
.chk{width:88px;height:88px;margin:8px auto 14px}
.chk circle{fill:none;stroke:var(--g);stroke-width:5;stroke-dasharray:252;stroke-dashoffset:252;animation:dr .6s ease-out forwards}
.chk path{fill:none;stroke:var(--g);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .4s .5s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.code{display:inline-block;font-size:30px;font-weight:800;letter-spacing:4px;color:var(--g);background:var(--mint);border:2px dashed #7fcfae;border-radius:16px;padding:10px 22px;margin:14px 0}
.done p{color:#475467;line-height:1.6}
.foot{text-align:center;color:var(--mut);font-size:13px;padding:26px 16px 10px;line-height:1.7}
.foot a{color:var(--g);font-weight:700;text-decoration:none}
.js .rv{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}.js .rv.in{opacity:1;transform:none}
@media (min-width:760px){.card{margin:-64px 0 0}.demo{margin:14px 0 0}.bar,.sec{padding-left:0;padding-right:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}.chk circle,.chk path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="cover"><div class="fl" id="fl" aria-hidden="true"></div>
  <div class="top w"><span class="tb" id="tb"></span><button class="lang" id="lang" aria-label="Language">EN · አማ</button></div>
</div>
<div class="w">
  <div class="card rv in"><div class="lg" id="lg">🍽</div><h1 id="rn">Menu</h1><div class="an am" id="ra"></div><div class="chips" id="chips"></div></div>
  <div class="demo" id="demo"><b>ማሳያ ምናሌ ነው · This menu is a demonstration</b>This restaurant is sample data while real partners join. An order placed here does not reach a kitchen. ይህ ምናሌ የናሙና ነው፤ የሚሰጠው ትዕዛዝ ወደ ማንም አይደርስም።</div>
</div>
<div class="bar w" id="bar">
  <div class="mini" id="mini"></div>
  <label class="search"><span>🔎</span><input id="q" type="search" placeholder="Search the menu · ምናሌ ይፈልጉ" autocomplete="off"></label>
  <div class="tabs" id="tabs"></div>
</div>
<main class="w" id="menu"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<div class="foot w">Scan · Order · Eat — <span class="am">ይቃኙ · ይዘዙ · ይመገቡ</span><br>Menu by <a href="/">BinaSmart</a> · Own a restaurant? <a href="/for-business">Get QR ordering free</a></div>

<div class="ob" id="ob"><button id="obb"><span class="n" id="obn">0</span><span>View order · <span class="am">ትዕዛዝ</span></span><span class="t" id="obt">0 ETB</span></button></div>
<div class="ov" id="ov"></div>
<div class="sh" id="sh" role="dialog" aria-modal="true"><div class="grab"></div><div class="in" id="shi"></div></div>

<script>
(function(){
var slug = decodeURIComponent(location.pathname.split('/')[2] || '');
var P = new URLSearchParams(location.search);
var table = String(P.get('table') || P.get('t') || '').replace(/[^\w -]/g, '').slice(0, 12);
var $ = function(id){ return document.getElementById(id); };
var R = null, MENU = [], CART = {}, NOTES = {}, AM = false;
try { AM = localStorage.getItem('rest-lang') === 'am'; } catch (e) {}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function birr(n){ return Number(n).toLocaleString('en-US') + ' ETB'; }
// a food picture when the restaurant has not added its own photo yet: the dish's emoji on a soft tile
var EMO = [[/coffee|macchiato|buna|ቡና/i,'☕'],[/tea|shai|ሻይ/i,'🍵'],[/water|ውሃ/i,'💧'],[/juice|ጭማቂ/i,'🧃'],[/soda|coke|pepsi|sprite|fanta|soft drink/i,'🥤'],[/beer|ቢራ/i,'🍺'],[/wine|ወይን/i,'🍷'],
  [/pizza|ፒዛ/i,'🍕'],[/burger|በርገር/i,'🍔'],[/pasta|spaghetti|macaroni|ፓስታ/i,'🍝'],[/fries|chips/i,'🍟'],[/sandwich|ሳንዱች/i,'🥪'],[/salad|ሰላጣ/i,'🥗'],[/fish|አሳ/i,'🐟'],[/chicken|doro|ዶሮ/i,'🍗'],
  [/tibs|kitfo|meat|beef|steak|ጥብስ|ክትፎ|ሥጋ|ስጋ/i,'🥩'],[/egg|እንቁላል|omelet/i,'🍳'],[/shiro|wot|wat|ሽሮ|ወጥ|injera|እንጀራ|firfir|ፍርፍር|beyaynetu|በያይነቱ/i,'🍛'],
  [/cake|tiramisu|ኬክ/i,'🍰'],[/ice ?cream|gelato|አይስክሬም/i,'🍨'],[/fruit|ፍራፍሬ/i,'🍉'],[/bread|ዳቦ/i,'🥖'],[/soup|ሾርባ/i,'🍲']];
var CATE = [[/drink|መጠጥ|beverage|coffee|juice/i,'🥤','#e0f2fe','#dbeafe'],[/dessert|sweet|ጣፋጭ|cake/i,'🍰','#fce7f3','#fdf2f8'],[/fast|burger|pizza/i,'🍔','#fef3c7','#fff7ed'],
  [/breakfast|ቁርስ/i,'🍳','#fef9c3','#fefce8'],[/main|ዋና|ethiopian|traditional|ባህላዊ/i,'🍛','#dcfce7','#f0fdf4']];
function look(m){ var c = CATE.find(function(x){ return x[0].test(m.category); }) || [0,'🍽️','#e7f5ef','#f3faf7'];
  var e = (EMO.find(function(x){ return x[0].test(m.name + ' ' + (m.nameAm || '')); }) || [0, c[1]])[1];
  return { e: e, bg: 'linear-gradient(135deg,' + c[2] + ',' + c[3] + ')' }; }
function pic(m, cls){ var l = look(m); return '<div class="' + cls + '" style="background:' + l.bg + '">' + (m.photo ? '<img src="' + esc(m.photo) + '" alt="" loading="lazy">' : l.e) + '</div>'; }
function nm(m){ return AM && m.nameAm ? m.nameAm : m.name; }
function na(m){ return AM ? (m.nameAm ? m.name : '') : (m.nameAm || ''); }

function load(){
  fetch('/api/restaurant/' + encodeURIComponent(slug)).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    if (!d){ $('rn').textContent = 'Restaurant not found'; $('menu').innerHTML = '<div class="none">This menu is not on BinaSmart. · ምናሌው አልተገኘም።</div>'; return; }
    R = d.restaurant; MENU = d.menu || [];
    document.title = R.name + ' · Menu, order at your table | BinaSmart';
    $('rn').textContent = R.name; $('ra').textContent = R.nameAm || ''; $('mini').textContent = R.name;
    $('lg').textContent = (R.name || '?').trim().charAt(0).toUpperCase();
    if (R.photo) { $('lg').innerHTML = '<img src="' + esc(R.photo) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:14px">'; }
    var chips = [];
    if (table) chips.push('<span class="tbl">🪑 Table ' + esc(table) + ' · <span class="am">ጠረጴዛ</span></span>');
    chips.push('<span>🍽️ Dine-in · <span class="am">እዚሁ</span></span>', '<span>💵 Pay at the table</span>');
    if (R.building) chips.push('<span>📍 ' + esc(R.building) + (R.unit ? ' · ' + esc(R.unit) : '') + '</span>');
    $('chips').innerHTML = chips.join('');
    if (table) { $('tb').innerHTML = '🪑 ' + esc(table); $('tb').classList.add('on'); }
    if (R.demo) $('demo').classList.add('on');
    var em = MENU.map(function(m){ return look(m).e; }); var f = ''; for (var i = 0; i < 60; i++) f += '<span>' + (em[i % Math.max(1, em.length)] || '🍽️') + '</span>'; $('fl').innerHTML = f;
    render();
  }).catch(function(){ $('menu').innerHTML = '<div class="none">Connection problem. Pull down to try again.</div>'; });
}
function cats(list){ var s = []; list.forEach(function(m){ if (s.indexOf(m.category) < 0) s.push(m.category); }); return s; }
function render(){
  var q = $('q').value.trim().toLowerCase();
  var list = MENU.filter(function(m){ return !q || (m.name + ' ' + (m.nameAm || '') + ' ' + (m.description || '')).toLowerCase().indexOf(q) >= 0; });
  var cs = cats(list);
  $('tabs').innerHTML = cs.map(function(c, i){ return '<button class="tab' + (i === 0 ? ' on' : '') + '" data-c="' + i + '">' + esc(c) + '</button>'; }).join('');
  $('menu').innerHTML = cs.length ? cs.map(function(c, i){
    return '<section class="sec" id="c' + i + '"><h2>' + esc(c) + '</h2>' + list.filter(function(m){ return m.category === c; }).map(function(m){
      var n = CART[m.id] || 0;
      return '<div class="it rv" data-id="' + esc(m.id) + '"><div class="tx"><div class="nm">' + esc(nm(m)) + '</div>' + (na(m) ? '<div class="na am">' + esc(na(m)) + '</div>' : '')
        + (m.description ? '<div class="ds">' + esc(m.description) + '</div>' : '') + '<div class="pr">' + birr(m.price) + '</div></div>'
        + '<div class="th">' + pic(m, 'im') + '<button class="add' + (n ? ' q' : '') + '" data-add="' + esc(m.id) + '" aria-label="Add ' + esc(m.name) + '">' + (n ? n : '+') + '</button></div></div>';
    }).join('') + '</section>';
  }).join('') : '<div class="none">Nothing matches "' + esc(q) + '". · አልተገኘም።</div>';
  reveal(); bar(); spy();
}
function reveal(){ var els = [].slice.call(document.querySelectorAll('.rv:not(.in)'));
  if (!('IntersectionObserver' in window)) { els.forEach(function(e){ e.classList.add('in'); }); return; }
  var io = new IntersectionObserver(function(es){ var k = 0; es.forEach(function(e){ if (e.isIntersecting){ e.target.style.transitionDelay = (k++ * 40) + 'ms'; e.target.classList.add('in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -5% 0px' });
  els.forEach(function(e){ io.observe(e); }); }
function totals(){ var n = 0, t = 0; Object.keys(CART).forEach(function(id){ var m = MENU.find(function(x){ return x.id === id; }); if (m) { n += CART[id]; t += m.price * CART[id]; } }); return { n: n, t: t }; }
function bar(){ var s = totals(); $('ob').classList.toggle('on', s.n > 0); $('obn').textContent = s.n; $('obt').textContent = birr(s.t); }
function add(id, d, el){ CART[id] = (CART[id] || 0) + d; if (CART[id] <= 0) delete CART[id];
  var b = document.querySelector('[data-add="' + id + '"]'); if (b) { b.textContent = CART[id] || '+'; b.classList.toggle('q', !!CART[id]); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  var ob = $('obn'); ob.classList.remove('pop'); void ob.offsetWidth; ob.classList.add('pop'); bar(); }
function open(html){ $('shi').innerHTML = html; $('ov').classList.add('on'); $('sh').classList.add('on'); $('sh').scrollTop = 0; }
function close(){ $('ov').classList.remove('on'); $('sh').classList.remove('on'); }
function item(id){ var m = MENU.find(function(x){ return x.id === id; }); if (!m) return; var q = CART[id] || 1;
  open(pic(m, 'hero') + '<h3>' + esc(nm(m)) + '</h3>' + (na(m) ? '<div class="sa am">' + esc(na(m)) + '</div>' : '') + (m.description ? '<div class="sd">' + esc(m.description) + '</div>' : '')
    + '<div class="sp">' + birr(m.price) + '</div><div class="step"><button data-st="-1">−</button><b id="sq">' + q + '</b><button data-st="1">+</button></div>'
    + '<button class="go" id="sa">Add to order · <span id="sat">' + birr(m.price * q) + '</span></button>');
  $('shi').onclick = function(e){ var s = e.target.closest('[data-st]'); if (s) { q = Math.max(1, Math.min(30, q + Number(s.getAttribute('data-st')))); $('sq').textContent = q; $('sat').textContent = birr(m.price * q); }
    if (e.target.closest('#sa')) { CART[id] = q; add(id, 0); close(); } }; }
function cart(){ var s = totals(); if (!s.n) return;
  open('<h3>Your order · <span class="am">ትዕዛዝዎ</span></h3>' + Object.keys(CART).map(function(id){ var m = MENU.find(function(x){ return x.id === id; });
      return '<div class="ln">' + pic(m, 'e') + '<div class="x"><b>' + esc(nm(m)) + '</b><small>' + birr(m.price) + '</small></div><div class="s"><button data-c="' + esc(id) + '" data-d="-1">−</button><b>' + CART[id] + '</b><button data-c="' + esc(id) + '" data-d="1">+</button></div></div>'; }).join('')
    + '<label class="lbl" for="ot">Table · ጠረጴዛ</label><input class="inp" id="ot" value="' + esc(table) + '" placeholder="Table number" inputmode="numeric">'
    + '<label class="lbl" for="on">Your name (optional) · ስም</label><input class="inp" id="on" placeholder="So the waiter knows it is you" autocomplete="given-name">'
    + '<label class="lbl" for="onote">Note (optional) · ማስታወሻ</label><input class="inp" id="onote" placeholder="No berbere, extra injera…">'
    + '<div class="tot"><span>Total · <span class="am">ጠቅላላ</span></span><b>' + birr(s.t) + '</b></div>'
    + '<button class="go" id="send">' + (R && R.demo ? '🧪 Try the demo order' : '👨‍🍳 Send to the kitchen · <span class="am">ወደ ማብሰያ ቤት ላክ</span>') + '</button>');
  $('shi').onclick = function(e){ var b = e.target.closest('[data-c]'); if (b) { add(b.getAttribute('data-c'), Number(b.getAttribute('data-d'))); if (!totals().n) close(); else cart(); return; }
    if (e.target.closest('#send')) send(); }; }
function send(){ var btn = $('send'); if (!btn || btn.disabled) return; btn.disabled = true; btn.textContent = 'Sending… · በመላክ ላይ';
  var t = $('ot').value.trim(), items = Object.keys(CART).map(function(id){ return { productId: id, qty: CART[id] }; });
  fetch('/api/restaurant/' + encodeURIComponent(R.id) + '/order', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ table: t, customerName: $('on').value.trim(), note: $('onote').value.trim(), items: items }) })
  .then(function(r){ return r.json().then(function(d){ return { s: r.status, d: d }; }); }).then(function(x){
    if (!x.d || !x.d.ok) { btn.disabled = false; btn.textContent = 'Try again · እንደገና'; alert(x.s === 429 ? 'Too many orders just now. Please ask the waiter.' : 'The order could not be sent. Please ask the waiter.'); return; }
    CART = {}; render();
    open('<div class="done"><svg class="chk" viewBox="0 0 88 88"><circle cx="44" cy="44" r="40"/><path d="M26 45 l12 12 l24 -26"/></svg>'
      + '<h3>' + (R.demo ? 'Demo order received' : 'Sent to the kitchen!') + '</h3><div class="am" style="color:var(--g);font-weight:700;margin-top:4px">' + (R.demo ? 'የማሳያ ትዕዛዝ' : 'ትዕዛዝዎ ወደ ማብሰያ ቤት ተልኳል!') + '</div>'
      + '<div class="code">' + esc(x.d.code) + '</div>'
      + '<p>' + (t ? 'Table ' + esc(t) + ' · ' : '') + 'Total <b>' + birr(x.d.total) + '</b><br>' + (R.demo ? 'This is a demonstration: no kitchen receives it.' : 'Pay at your table when it arrives.<br><span class="am">ሲደርስ ጠረጴዛዎ ላይ ይክፈሉ።</span>') + '</p>'
      + '<button class="go" id="more">Order more · <span class="am">ተጨማሪ ይዘዙ</span></button></div>');
    $('shi').onclick = function(e){ if (e.target.closest('#more')) close(); };
  }).catch(function(){ btn.disabled = false; btn.textContent = 'Try again · እንደገና'; alert('Connection problem. Please try again.'); }); }

document.addEventListener('click', function(e){
  var a = e.target.closest('[data-add]'); if (a) { e.stopPropagation(); add(a.getAttribute('data-add'), 1); return; }
  var it = e.target.closest('.it'); if (it) { item(it.getAttribute('data-id')); return; }
  var tb = e.target.closest('.tab'); if (tb) { var s = $('c' + tb.getAttribute('data-c')); if (s) window.scrollTo({ top: s.getBoundingClientRect().top + scrollY - $('bar').offsetHeight - 6, behavior: 'smooth' }); } });
$('obb').onclick = cart; $('ov').onclick = close;
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
$('q').addEventListener('input', function(){ render(); });
$('lang').onclick = function(){ AM = !AM; try { localStorage.setItem('rest-lang', AM ? 'am' : 'en'); } catch (e) {} $('lang').textContent = AM ? 'አማ · EN' : 'EN · አማ'; render(); };
$('lang').textContent = AM ? 'አማ · EN' : 'EN · አማ';
// the tab of the section in view lights up; the bar gets a shadow once it sticks
function spy(){ var secs = [].slice.call(document.querySelectorAll('.sec')), off = $('bar').offsetHeight + 20, cur = 0;
  secs.forEach(function(s, i){ if (s.getBoundingClientRect().top - off <= 0) cur = i; });
  [].forEach.call(document.querySelectorAll('.tab'), function(t, i){ var on = i === cur; if (on !== t.classList.contains('on')) { t.classList.toggle('on', on); if (on) { var tb = $('tabs'); tb.scrollTo({ left: t.offsetLeft - tb.clientWidth / 2 + t.clientWidth / 2, behavior: 'smooth' }); } } });
  $('bar').classList.toggle('stuck', $('bar').getBoundingClientRect().top <= 0 && scrollY > 150); }
var tk = false; window.addEventListener('scroll', function(){ if (!tk) { tk = true; requestAnimationFrame(function(){ spy(); tk = false; }); } }, { passive: true });
load();
})();
</script>
