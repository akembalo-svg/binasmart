<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Restaurant dashboard · ዳሽቦርድ | BinaSmart</title><meta name="robots" content="noindex"><meta name="theme-color" content="#00704A">
<link rel="icon" href="/icon-32.png"><link rel="stylesheet" href="/static/fonts/fonts.css?v=2"><link rel="stylesheet" href="/static/restaurants.css?v=1">
<style>
.dash{max-width:720px;margin:24px auto 60px;padding:0 16px}.dash h1{font-size:26px;margin:0 0 4px}.lead{color:var(--mu);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:18px;box-shadow:var(--sh);margin:0 0 16px}
.box h2{font-size:19px;margin:0 0 4px}.box .sub{color:var(--mu);font-size:14px;margin:0 0 12px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}input,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}.row{display:grid;grid-template-columns:1fr 130px 40px;gap:8px;margin:0 0 8px}.row button{border:0;background:#fee2e2;color:#b91c1c;border-radius:10px;font-size:16px;cursor:pointer}
.go{display:inline-block;border:0;background:var(--b);color:#fff;font:inherit;font-weight:700;padding:12px 18px;border-radius:12px;cursor:pointer;margin-top:14px;text-decoration:none}
.add{border:1px dashed var(--b);background:#fff;color:var(--b);font:inherit;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer}
.tog{display:flex;gap:10px;align-items:center;font-weight:600;margin:10px 0}.tog input{width:22px;height:22px}.lk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.lk a,.lk button{border:1px solid var(--b);background:#fff;color:var(--b);font:inherit;font-weight:600;padding:8px 12px;border-radius:10px;text-decoration:none;cursor:pointer}
.od{border:1px solid var(--ln);border-radius:14px;padding:12px;margin:8px 0}.od.new{border-color:var(--b);background:#ecfdf5}.od b{font-size:16px}.od .t{color:var(--mu);font-size:13px}.od ul{margin:6px 0 6px 18px;padding:0}.od .st button{border:0;background:var(--b);color:#fff;font:inherit;font-weight:600;padding:6px 10px;border-radius:8px;margin-right:6px;cursor:pointer}
.msg{margin-top:10px;font-weight:600}.ok{color:#047857}.err{color:#b91c1c}.code{letter-spacing:.12em;text-transform:uppercase;max-width:240px}
</style></head><body>
<header class="top"><div class="w"><a class="brand" href="/restaurants"><i>🍽</i>BinaSmart <small>Restaurants · ምግብ ቤቶች</small></a><nav><a href="/restaurants">All places</a></nav></div></header>
<main class="dash"><h1>Your restaurant dashboard</h1><p class="lead am">የምግብ ቤትዎ ዳሽቦርድ — ስልክ፣ ሰዓትና ምግቦችዎን እዚህ ይቀይሩ።</p><div id="app"><p class="lead">Loading…</p></div></main>
<footer class="foot w">Changes show on your page at once. Our team sees every change and can hide a page that breaks the rules. BinaSmart does not deliver food or take payments.<br><a href="/">bina.et</a></footer>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ERR = { phone: 'Please type an Ethiopian number, like 09xx xxx xxx or 011 xxx xxxx.', slow_down: 'Too many tries. Please wait a little.', bad_code: 'That code does not work. Check it, or ask our team for a new one.', not_found: 'This page is not linked to your account.' };
  function post(url, body) { return fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json().catch(function () { return { ok: false }; }); }); }
  function dishRow(d) { return '<div class="row"><input placeholder="Dish · ምግብ" value="' + esc(d.name) + '" maxlength="60"><input placeholder="Price · ዋጋ" value="' + esc(d.price) + '" maxlength="30"><button type="button" aria-label="Remove">✕</button></div>'; }
  function codeBox() {
    return '<div class="box"><h2>Have a code? · ኮድ አለዎት?</h2><p class="sub">Our team gave you an 8-letter code on the call. Type it once to link your restaurant.</p>'
      + '<form id="cf"><input class="code" id="code" placeholder="XXXX-XXXX" maxlength="9" autocomplete="one-time-code"><br><button class="go" type="submit">Link my restaurant</button><div class="msg" id="cm"></div></form></div>';
  }
  function card(r) {
    return '<form class="box rf" data-id="' + esc(r.id) + '"><h2>' + esc(r.restaurant) + '</h2><p class="sub">' + (r.url ? '<a href="' + esc(r.url) + '" target="_blank">See your page →</a>' : 'Not on the map yet: our team adds it.') + (r.status === 'hidden' ? ' · <b class="err">Hidden by our team: call us</b>' : '') + '</p>'
      + '<label>Number customers should call · ደንበኞች የሚደውሉበት ቁጥር</label><input name="publicPhone" value="' + esc(r.publicPhone) + '" inputmode="tel" placeholder="09xx xxx xxx">'
      + '<label>Opening hours · የሥራ ሰዓት</label><input name="hours" value="' + esc(r.hours) + '" maxlength="120" placeholder="Mon-Sat 8:00-22:00">'
      + '<label>About your place · ስለ ምግብ ቤትዎ</label><textarea name="about" maxlength="400">' + esc(r.about) + '</textarea>'
      + '<label>Dishes and prices · ምግቦችና ዋጋ</label><div class="dl">' + (r.dishes.length ? r.dishes : [{ name: '', price: '' }]).map(dishRow).join('') + '</div>'
      + '<button type="button" class="add">＋ Add a dish</button><br><button class="go" type="submit">Save · አስቀምጥ</button><div class="msg"></div></form>'
      + ordersBox(r);
  }
  // table QR ordering (restaurants/orders.js): the switch, Telegram, the cards and the orders as they come in
  function ordersBox(r) {
    if (!r.url) return '';
    return '<div class="box ob" data-id="' + esc(r.id) + '" data-url="' + esc(r.url) + '"><h2>Table orders · የጠረጴዛ ትዕዛዝ</h2><p class="sub">Put a QR card on each table. Guests open your menu, choose and send, or press "Call the waiter" / "Bring the bill"; it comes to your Telegram and here. They pay at the table. Free, no commission.</p>'
      + '<label class="tog"><input type="checkbox" class="on"' + (r.dishes.length ? '' : ' disabled') + '> Take orders and waiter calls from the table QR · ትዕዛዝ ተቀበል</label>' + (r.dishes.length ? '' : '<p class="sub">Add your dishes and save first.</p>')
      + '<div class="lk"><button type="button" class="tg">🔔 Connect Telegram</button><a href="' + esc(r.url) + '/qr?n=8" target="_blank">🖨 Table QR cards</a><a href="' + esc(r.url) + '/menu?table=1" target="_blank">See your menu</a><button type="button" class="nc">🔄 New cards</button></div><p class="sub" style="margin:0">Print the cards while signed in: only those take orders. Lost a card, or a photo of one got out? Press New cards and print again.</p><div class="msg"></div><div class="ol"></div></div>';
  }
  function load() {
    fetch('/api/restaurants/mine', { credentials: 'same-origin' }).then(function (r) { return r.status === 401 ? null : r.json(); }).then(function (d) {
      if (!d) {
        app.innerHTML = '<div class="box"><h2>Sign in first · መጀመሪያ ይግቡ</h2><p class="sub">Sign in with Telegram or your phone. If you sign in with the number our team called, your restaurant links by itself.</p><a class="go" href="/login?next=/restaurants/dashboard">Sign in</a></div>';
        return;
      }
      app.innerHTML = (d.restaurants.length ? d.restaurants.map(card).join('') : '<div class="box"><h2>No restaurant linked yet</h2><p class="sub">Claim your page first: find it on <a href="/restaurants">bina.et/restaurants</a> and press <b>Claim this page</b>. After our team confirms, you get a code.</p></div>') + codeBox();
      wire(); wireOrders();
    }).catch(function () { app.innerHTML = '<p class="err">Could not load. Please try again.</p>'; });
  }
  function wire() {
    var cf = document.getElementById('cf');
    if (cf) cf.addEventListener('submit', function (e) {
      e.preventDefault(); var m = document.getElementById('cm');
      post('/api/restaurants/code', { code: document.getElementById('code').value }).then(function (j) {
        if (j.ok) { load(); } else { m.className = 'msg err'; m.textContent = ERR[j.error] || 'Something went wrong.'; }
      });
    });
    [].forEach.call(document.querySelectorAll('.rf'), function (f) {
      f.querySelector('.add').addEventListener('click', function () { f.querySelector('.dl').insertAdjacentHTML('beforeend', dishRow({ name: '', price: '' })); });
      f.addEventListener('click', function (e) { if (e.target.matches('.row button')) e.target.parentNode.remove(); });
      f.addEventListener('submit', function (e) {
        e.preventDefault(); var m = f.querySelector('.msg');
        var dishes = [].map.call(f.querySelectorAll('.row'), function (r) { var i = r.querySelectorAll('input'); return { name: i[0].value.trim(), price: i[1].value.trim() }; }).filter(function (d) { return d.name; });
        post('/api/restaurants/mine/' + encodeURIComponent(f.getAttribute('data-id')), { publicPhone: f.publicPhone.value, hours: f.hours.value, about: f.about.value, dishes: dishes }).then(function (j) {
          if (j.ok) { m.className = 'msg ok'; m.textContent = '✓ Saved. It is on your page now. · ተቀምጧል።'; }
          else { m.className = 'msg err'; m.textContent = ERR[j.error] || 'Something went wrong.'; }
        });
      });
    });
  }
  var seen = {}, beepOk = false;
  document.addEventListener('click', function () { beepOk = true; }, { once: true });
  function beep() { if (!beepOk) return; try { var a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.value = 0.2; o.start(); o.stop(a.currentTime + 0.35); } catch (e) {} }
  function orderHtml(o) {
    if (o.type === 'call') return '<div class="od' + (o.status === 'new' ? ' new' : '') + '"><b>' + (o.kind === 'bill' ? '🧾 Table ' + o.table + ' · the bill, please' : '🙋 Table ' + o.table + ' · calling the waiter') + '</b> <span class="t">' + esc(new Date(o.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })) + ' · ' + esc(o.status) + '</span>'
      + (o.status === 'done' ? '' : '<div class="st"><button type="button" data-o="' + esc(o.id) + '" data-s="done">Done</button></div>') + '</div>';
    return '<div class="od' + (o.status === 'new' ? ' new' : '') + '"><b>Table ' + o.table + ' · ' + esc(o.code) + '</b> <span class="t">' + esc(new Date(o.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })) + ' · ' + esc(o.status) + '</span>'
      + '<ul>' + o.items.map(function (x) { return '<li>' + x.qty + ' × ' + esc(x.name) + (x.price ? ' (' + x.price + ')' : '') + '</li>'; }).join('') + '</ul>'
      + (o.total ? '<div>Total ' + Number(o.total).toLocaleString() + ' ETB' + (o.priced ? '' : ' + items without a price') + '</div>' : '') + (o.note ? '<div>📝 ' + esc(o.note) + '</div>' : '')
      + (o.status === 'done' ? '' : '<div class="st">' + (o.status === 'new' ? '<button type="button" data-o="' + esc(o.id) + '" data-s="seen">Seen</button>' : '') + '<button type="button" data-o="' + esc(o.id) + '" data-s="done">Done</button></div>') + '</div>';
  }
  function poll(b) {
    var id = encodeURIComponent(b.getAttribute('data-id'));
    return fetch('/api/restaurants/mine/' + id + '/orders', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) return;
      b.querySelector('.on').checked = d.ordersOn;
      b.querySelector('.tg').textContent = d.telegram ? '✓ Telegram connected' : '🔔 Connect Telegram';
      var fresh = d.orders.some(function (o) { return o.status === 'new' && !seen[o.id] && Object.keys(seen).length; });
      d.orders.forEach(function (o) { seen[o.id] = 1; });
      if (fresh) beep();
      b.querySelector('.ol').innerHTML = d.orders.length ? d.orders.map(orderHtml).join('') : (d.ordersOn ? '<p class="sub">No orders yet. New ones show here by themselves.</p>' : '');
    }).catch(function () {});
  }
  function wireOrders() {
    [].forEach.call(document.querySelectorAll('.ob'), function (b) {
      var id = encodeURIComponent(b.getAttribute('data-id')), m = b.querySelector('.msg');
      b.querySelector('.on').addEventListener('change', function () {
        var on = this.checked;
        post('/api/restaurants/mine/' + id + '/settings', { ordersOn: on }).then(function (j) {
          m.className = 'msg ' + (j.ok ? 'ok' : 'err'); m.textContent = j.ok ? (on ? '✓ Table orders are ON. Print the cards and put them on the tables.' : 'Table orders are off. Guests see the menu only.') : (j.error === 'no_dishes' ? 'Add your dishes and save first.' : 'Something went wrong.');
          poll(b);
        });
      });
      b.querySelector('.tg').addEventListener('click', function () {
        fetch('/api/restaurants/mine/' + id + '/telegram', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
          if (j.ok) { window.open(j.url, '_blank'); m.className = 'msg ok'; m.textContent = 'In Telegram, press START. Orders will come to that chat.'; }
        });
      });
      b.querySelector('.nc').addEventListener('click', function () {
        if (!window.confirm('Make new table cards? The cards on your tables now will stop taking orders until you print and put out the new ones.')) return;
        post('/api/restaurants/mine/' + id + '/settings', { newCards: true }).then(function (j) {
          m.className = 'msg ' + (j.ok ? 'ok' : 'err'); m.textContent = j.ok ? '✓ New cards made. Press "Table QR cards" and print them; the old ones now only show the menu.' : 'Something went wrong.';
        });
      });
      b.addEventListener('click', function (e) {
        var o = e.target.getAttribute('data-o'); if (!o) return;
        post('/api/restaurants/mine/' + id + '/orders/' + encodeURIComponent(o), { status: e.target.getAttribute('data-s') }).then(function () { poll(b); });
      });
      poll(b);
    });
  }
  setInterval(function () { if (!document.hidden) [].forEach.call(document.querySelectorAll('.ob'), function (b) { if (b.querySelector('.on').checked) poll(b); }); }, 20000);
  load();
})();
</script></body></html>
