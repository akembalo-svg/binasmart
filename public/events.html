<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cinema & Event Tickets — Book Direct | BinaSmart Events</title>
<meta name="description" content="Cinema, concerts and events in Addis Ababa — tiered seats, instant ticket code, pay at the door. Amharic + English. Powered by BinaSmart.">
<link rel="icon" href="/icon-32.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans Ethiopic',sans-serif;background:#faf8f4;color:#1e293b;min-height:100vh;padding-bottom:40px}
.top{display:flex;align-items:center;gap:8px;padding:14px 18px;max-width:680px;margin:0 auto}
.top a{text-decoration:none;color:#1e293b;font-weight:900;font-size:17px}
.top .g{color:#d4a017}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(135deg,#3b0764,#6d28d9);border-radius:22px;padding:22px 18px;color:#fff;position:relative;overflow:hidden}
.hero::after{content:'🎬';position:absolute;right:-10px;bottom:-16px;font-size:92px;opacity:.14;transform:rotate(-12deg)}
.hero h1{font-size:24px;font-weight:900}
.hero .am{color:#ddd6fe;font-weight:800;font-size:14px}
.hero .sub{font-size:11.5px;opacity:.85;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:#fff;border:1.5px solid #e9e4da;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:800;cursor:pointer;color:#475569}
.chip.on{background:#3b0764;color:#fff;border-color:#3b0764}
.ev{display:grid;grid-template-columns:auto 1fr;gap:14px;background:#fff;border:1.5px solid #e9e4da;border-radius:20px;padding:16px;margin-top:12px}
.date{width:64px;border-radius:16px;background:#f5f3ff;text-align:center;padding:10px 4px;align-self:start}
.date b{display:block;font-size:24px;font-weight:900;color:#6d28d9;line-height:1}
.date span{font-size:10px;font-weight:800;color:#8b5cf6;text-transform:uppercase}
.date .tm{font-size:10px;color:#94a3b8;font-weight:700;margin-top:4px;display:block}
.ev .ty{font-size:10px;font-weight:900;letter-spacing:1.5px;color:#6d28d9;text-transform:uppercase}
.ev h3{font-size:17px;font-weight:900;line-height:1.3;margin:4px 0 2px}
.ev .am{font-size:12.5px;color:#64748b}
.ev .venue{font-size:11.5px;color:#94a3b8;font-weight:700;margin-top:5px}
.ev .row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ev .pr b{font-size:16px;color:#3b0764}
.ev .pr span{font-size:10px;color:#94a3b8;font-weight:700;display:block}
.left{font-size:11px;font-weight:800}
.left.ok{color:#059669}.left.low{color:#d97706}.left.no{color:#dc2626}
.bkbtn{border:0;border-radius:13px;padding:10px 20px;background:linear-gradient(135deg,#3b0764,#6d28d9);color:#fff;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit}
.bkbtn:disabled{background:#cbd5e1;cursor:not-allowed}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:680px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h3{font-size:17px;font-weight:900;margin-bottom:4px}
.sheet .sm{font-size:12px;color:#64748b;margin-bottom:12px}
.tier{display:flex;align-items:center;gap:12px;border:1.5px solid #e9e4da;border-radius:16px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.tier.sel{border-color:#6d28d9;background:#f5f3ff}
.tier .tn{font-weight:800;font-size:14px}
.tier .ta{font-size:11px;color:#64748b}
.tier .bar{height:4px;border-radius:99px;background:#eee;margin-top:6px;overflow:hidden}
.tier .bar i{display:block;height:100%;background:#6d28d9}
.tier .tp{margin-left:auto;font-weight:900;color:#3b0764;font-size:15px;flex-shrink:0}
label{font-size:11px;font-weight:900;color:#64748b;display:block;margin:12px 0 4px;text-transform:uppercase;letter-spacing:1px}
input,select{width:100%;border:1.5px solid #e9e4da;border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;background:#faf8f4}
.tot{display:flex;justify-content:space-between;background:#f5f3ff;border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:900}
.tot b{color:#3b0764}
.obtn{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,#3b0764,#6d28d9);color:#fff;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit;margin-top:12px}
.conf{text-align:center;padding:16px 0}
.conf .big{font-size:52px}
.conf h3{font-size:20px}
.stub{margin:16px auto;max-width:330px;background:linear-gradient(135deg,#3b0764,#6d28d9);color:#fff;border-radius:20px;padding:0;text-align:left;overflow:hidden;position:relative}
.stub .main{padding:18px 18px 14px}
.stub .ev-t{font-weight:900;font-size:16px;line-height:1.3}
.stub .ev-am{color:#ddd6fe;font-size:12px}
.stub .mrow{display:flex;justify-content:space-between;font-size:12px;margin-top:10px;color:#ddd6fe}
.stub .mrow b{color:#fff}
.stub .tear{border-top:2px dashed rgba(255,255,255,.4);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(0,0,0,.15)}
.stub .code{font-size:20px;font-weight:900;letter-spacing:2px}
.stub .gold{color:#fcd34d;font-weight:900;font-size:11px}
.conf p{font-size:12.5px;color:#64748b;line-height:1.6}
.wa{display:inline-block;background:#25D366;color:#fff;font-weight:900;border-radius:999px;padding:12px 26px;text-decoration:none;margin-top:10px;font-size:14px}
.skel{background:linear-gradient(90deg,#eee 25%,#f7f5f0 50%,#eee 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px;height:110px;margin-top:12px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="top"><a href="/">🏢 Bina<span class="g">Smart</span></a><span style="margin-left:auto;font-size:11px;font-weight:800;color:#6d28d9">🎬 Events · Book direct</span></div>
<div class="wrap">
  <div class="hero"><h1>🎬 Cinema & Events</h1><div class="am">የሲኒማ እና የዝግጅት ትኬቶች — በቀጥታ ያስይዙ</div><div class="sub">Tiered seats · instant ticket code · pay at the door · Demo — sample events</div></div>
  <div class="chips" id="chips"></div>
  <div id="list"><div class="skel"></div><div class="skel"></div></div>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const $ = id => document.getElementById(id);
let EVENTS = [], TYPE = null, SEL = null;
const TYPES = { CINEMA: '🎬 ሲኒማ', CONCERT: '🎵 ኮንሰርት', MEETUP: '🤝 ስብሰባ', THEATER: '🎭 ቲያትር', FESTIVAL: '🎉 ፌስቲቫል' };
const fmtD = s => new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'Africa/Addis_Ababa' }).split(' ');
const fmtT = s => new Date(s).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Addis_Ababa' });
async function load(){
  const d = await (await fetch('/api/events')).json();
  EVENTS = d.events;
  const types = [...new Set(EVENTS.map(e => e.type))];
  $('chips').innerHTML = '<div class="chip on" onclick="setType(this,null)">ሁሉም All</div>'
    + types.map(t => '<div class="chip" onclick="setType(this,\'' + t + '\')">' + (TYPES[t] || t) + '</div>').join('');
  render();
}
function setType(el, t){ document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); el.classList.add('on'); TYPE = t; render(); }
function render(){
  const list = EVENTS.filter(e => !TYPE || e.type === TYPE);
  $('list').innerHTML = list.length ? list.map(e => {
    const [day, mon] = fmtD(e.startsAt);
    const s = e.totalLeft <= 0 ? '<span class="left no">✖ Sold out</span>'
      : e.totalLeft <= 20 ? '<span class="left low">🔥 Selling fast — ' + e.totalLeft + ' left</span>'
      : '<span class="left ok">✓ ' + e.totalLeft + ' tickets</span>';
    return '<div class="ev"><div class="date"><b>' + day + '</b><span>' + mon + '</span><span class="tm">' + fmtT(e.startsAt) + '</span></div>'
      + '<div><div class="ty">' + (TYPES[e.type] || e.type) + '</div><h3>' + e.title + '</h3><div class="am">' + (e.titleAm || '') + '</div>'
      + '<div class="venue">📍 ' + e.venue + ' · ' + e.city + '</div>'
      + '<div class="row"><div class="pr"><b>from ' + e.priceFrom.toLocaleString() + ' ETB</b><span>' + s.replace(/<[^>]+>/g,'') + '</span></div>'
      + '<button class="bkbtn" ' + (e.totalLeft <= 0 ? 'disabled' : '') + ' onclick="openBook(\'' + e.slug + '\')">🎟 Book · ያስይዙ</button></div></div></div>';
  }).join('') : '<p style="text-align:center;color:#94a3b8;padding:24px">No events found</p>';
}
function openBook(slug){
  const e = EVENTS.find(x => x.slug === slug); if (!e) return;
  SEL = { e, tier: null };
  $('modal').classList.add('on');
  const [day, mon] = fmtD(e.startsAt);
  $('sheet').innerHTML = '<h3>' + (e.emoji || '🎬') + ' ' + e.title + '</h3>'
    + '<div class="sm">' + (e.titleAm || '') + ' · 📍 ' + e.venue + ' · ' + day + ' ' + mon + ', ' + fmtT(e.startsAt) + '</div>'
    + '<div id="tiers">' + e.tiers.map((t, i) => {
        const pct = Math.max(0, Math.min(100, (t.available / t.seats) * 100));
        const dis = t.available <= 0;
        return '<div class="tier' + (dis ? '" style="opacity:.45' : '') + '" onclick="' + (dis ? '' : 'selTier(' + i + ')') + '" id="tier' + i + '">'
          + '<div style="flex:1"><div class="tn">' + t.name + (t.nameAm ? ' · ' + t.nameAm : '') + '</div>'
          + '<div class="ta">' + (dis ? '✖ Sold out' : t.available + ' seats left') + '</div>'
          + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>'
          + '<div class="tp">' + t.price.toLocaleString() + ' ETB</div></div>';
      }).join('') + '</div>'
    + '<label>Tickets / ትኬቶች</label><select id="eq">' + [1,2,3,4,5,6].map(n => '<option>' + n + '</option>').join('') + '</select>'
    + '<label>Full name / ሙሉ ስም</label><input id="en" placeholder="Your name">'
    + '<label>Phone / ስልክ</label><input id="ep" placeholder="09…" inputmode="tel">'
    + '<div class="tot"><span>Total · ጠቅላላ</span><b id="et">— ETB</b></div>'
    + '<button class="obtn" onclick="submitBook()">🎟 Get my tickets · ትኬቶቼን ስጠኝ</button>';
  $('eq').onchange = updTot;
  $('modal').onclick = ev => { if (ev.target === $('modal')) $('modal').classList.remove('on'); };
}
function selTier(i){
  SEL.tier = SEL.e.tiers[i];
  document.querySelectorAll('.tier').forEach((el, j) => el.classList.toggle('sel', j === i));
  updTot();
}
function updTot(){ if (SEL.tier) $('et').textContent = (SEL.tier.price * +$('eq').value).toLocaleString() + ' ETB'; }
async function submitBook(){
  if (!SEL.tier) return alert('Please choose a seat tier / የመቀመጫ ደረጃ ይምረጡ');
  const en = $('en').value.trim(), ep = $('ep').value.trim();
  if (!en || !ep) return alert('Please enter name and phone / ስም እና ስልክ ያስገቡ');
  const r = await fetch('/api/events/' + SEL.e.slug + '/book', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tier: SEL.tier.name, qty: +$('eq').value, name: en, phone: ep }) });
  const d = await r.json();
  if (!d.ok){ alert(d.error === 'not_available' ? 'Only ' + d.available + ' seats left in this tier' : '❌ ' + (d.error || 'error')); return; }
  const [day, mon] = fmtD(d.startsAt);
  const summary = '🎟 Ticket ' + d.code + '\n' + d.event + '\n' + d.venue + ' · ' + day + ' ' + mon + ' ' + fmtT(d.startsAt) + '\n' + d.tier + ' ×' + d.qty + ' · ' + d.total.toLocaleString() + ' ETB\n' + en;
  $('sheet').innerHTML = '<div class="conf"><div class="big">🎉</div><h3>Tickets booked! · ትኬትዎ ተይዟል!</h3>'
    + '<div class="stub"><div class="main"><div class="ev-t">' + d.event + '</div><div class="ev-am">' + (d.eventAm || '') + '</div>'
    + '<div class="mrow"><span>📍 <b>' + d.venue + '</b></span><span>🗓 <b>' + day + ' ' + mon + ' · ' + fmtT(d.startsAt) + '</b></span></div>'
    + '<div class="mrow"><span>Seat: <b>' + d.tier + ' ×' + d.qty + '</b></span><span>Total: <b>' + d.total.toLocaleString() + ' ETB</b></span></div></div>'
    + '<div class="tear"><span class="code">' + d.code + '</span><span class="gold">ADMIT ' + d.qty + '</span></div></div>'
    + '<p>Show this code at the door — pay there.<br>ኮዱን በበሩ ላይ ያሳዩ፤ ክፍያ እዚያው።</p>'
    + '<a href="/pay?amount=' + d.total + '&for=' + encodeURIComponent(d.event||'Event ticket') + '&bt=event&bc=' + encodeURIComponent(d.code) + '" style="display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,#0b2a26,#068c78);color:#fff;font-weight:800;border-radius:14px;padding:14px;margin:8px 0 10px">💳 አሁን በኦንላይን ይክፈሉ · Pay online</a>'
    + '<a class="wa" href="https://wa.me/?text=' + encodeURIComponent(summary) + '">💬 Save to WhatsApp</a></div>';
  load();
}
load();
</script>
</body>
</html>
