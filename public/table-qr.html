<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Table QR cards · Print | BinaSmart</title>
<link rel="icon" href="/icon-32.png">
<link rel="stylesheet" href="/static/fonts/fonts.css?v=2">
<style>
/* Table cards a restaurant prints and puts on each table (30 Sep 2026). A4, four A6 cards per page; each QR opens
   /restaurant/<slug>?table=N, drawn by bina.et's own /qr.svg (no outside QR service). */
:root{--g:#00704A;--g3:#00C896;--ink:#081120;--mint:#e8f6f0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Noto Sans Ethiopic',-apple-system,'Segoe UI',sans-serif;background:#e9eeec;color:var(--ink)}
.am{font-family:'Noto Sans Ethiopic','Inter',sans-serif}
.tools{position:sticky;top:0;z-index:5;background:#081120;color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-size:14px}
.tools b{font-size:15px}.tools input{width:74px;border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:15px}
.tools button{border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--g3),var(--g));color:#fff}
.tools small{opacity:.75}
.sheet{width:210mm;height:297mm;margin:10mm auto;background:#fff;display:grid;grid-template-columns:105mm 105mm;grid-template-rows:148.5mm 148.5mm;box-shadow:0 10px 40px rgba(8,17,32,.15);page-break-after:always;break-after:page}
.sheet:last-child{page-break-after:auto;break-after:auto}
.cd{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;border:.2mm dashed #cfd8d4}
.cd .top{width:100%;background:radial-gradient(120% 120% at 0% 0%,#00C896 0%,rgba(0,200,150,0) 60%),linear-gradient(135deg,#00704A,#005c3d 70%,#081120 150%);color:#fff;padding:7mm 6mm 12mm}
.cd .rn{font-size:6.2mm;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.cd .ra{font-size:4.2mm;color:#c9f3e2;font-weight:700;margin-top:1mm}
.cd .tn{position:relative;margin-top:-9mm;width:18mm;height:18mm;border-radius:50%;background:#fff;border:1.2mm solid var(--g);display:grid;place-items:center;box-shadow:0 2mm 5mm rgba(0,112,74,.25)}
.cd .tn b{font-size:7.5mm;font-weight:800;line-height:1;color:var(--g)}
.cd .tl{font-size:2.8mm;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#667085;margin-top:1.6mm}
.cd .qr{margin-top:3mm;width:52mm;height:52mm;padding:2.2mm;border-radius:5mm;border:.8mm solid var(--mint);background:#fff}
.cd .qr img{width:100%;height:100%;display:block}
.cd .cta{margin-top:3.5mm;font-size:5.4mm;font-weight:800;letter-spacing:-.01em}
.cd .cta .am{display:block;font-size:4.2mm;color:var(--g);margin-top:.6mm}
.cd .st{display:flex;gap:2.6mm;margin-top:3.2mm;font-size:2.8mm;font-weight:700;color:#475467}
.cd .st span{display:flex;align-items:center;gap:1mm}.cd .st i{font-style:normal;width:4.4mm;height:4.4mm;border-radius:50%;background:var(--mint);color:var(--g);display:grid;place-items:center;font-size:2.6mm;font-weight:800}
.cd .ft{position:absolute;bottom:4.5mm;left:0;right:0;font-size:2.6mm;color:#98a2b3;font-weight:600}
.cd .ft b{color:var(--g)}
@media print{body{background:#fff}.tools{display:none}.sheet{margin:0;box-shadow:none}@page{size:A4;margin:0}}
@media screen and (max-width:230mm){.sheet{transform:scale(.46);transform-origin:top center;margin:4mm auto -150mm}}
</style>
</head>
<body>
<div class="tools">
  <b>🪑 Table QR cards · <span class="am">የጠረጴዛ QR</span></b>
  <label>Tables · <span class="am">ጠረጴዛዎች</span> <input id="n" type="number" min="1" max="80"></label>
  <label>From · <span class="am">ከ</span> <input id="f" type="number" min="1" max="999"></label>
  <button onclick="window.print()">🖨 Print · <span class="am">አትም</span></button>
  <small>Cut along the dashed lines; one card per table.</small>
</div>
<div id="pages"></div>
<script>
(function(){
  var P = new URLSearchParams(location.search);
  var slug = String(P.get('r') || 'bina-restaurant').replace(/[^\wሀ-፿.' -]/g, '').slice(0, 80);
  var name = String(P.get('name') || slug.replace(/-/g, ' ')).slice(0, 60), nameAm = String(P.get('am') || '').slice(0, 60);
  var n = Math.max(1, Math.min(80, parseInt(P.get('n'), 10) || 10)), from = Math.max(1, Math.min(999, parseInt(P.get('from'), 10) || 1));
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function card(t){
    var path = '/restaurant/' + encodeURIComponent(slug) + '?table=' + t;
    return '<div class="cd"><div class="top"><div class="rn">' + esc(name) + '</div>' + (nameAm ? '<div class="ra am">' + esc(nameAm) + '</div>' : '') + '</div>'
      + '<div class="tn"><b>' + t + '</b></div><div class="tl">Table · <span class="am">ጠረጴዛ</span></div>'
      + '<div class="qr"><img src="/qr.svg?p=' + encodeURIComponent(path) + '" alt="QR for table ' + t + '"></div>'
      + '<div class="cta">Scan · Order · Eat<span class="am">ይቃኙ · ይዘዙ · ይመገቡ</span></div>'
      + '<div class="st"><span><i>1</i>Scan · <span class="am">ይቃኙ</span></span><span><i>2</i>Choose · <span class="am">ይምረጡ</span></span><span><i>3</i>We bring it · <span class="am">እናመጣለን</span></span></div>'
      + '<div class="ft">No app needed · <span class="am">መተግበሪያ አያስፈልግም</span> · <b>bina.et</b></div></div>';
  }
  function draw(){
    var h = '', cards = [];
    for (var t = from; t < from + n; t++) cards.push(card(t));
    for (var i = 0; i < cards.length; i += 4) h += '<div class="sheet">' + cards.slice(i, i + 4).join('') + '</div>';
    document.getElementById('pages').innerHTML = h;
    document.title = name + ' · table QR cards';
  }
  var ni = document.getElementById('n'), fi = document.getElementById('f');
  ni.value = n; fi.value = from;
  ni.oninput = fi.oninput = function(){ n = Math.max(1, Math.min(80, parseInt(ni.value, 10) || 1)); from = Math.max(1, Math.min(999, parseInt(fi.value, 10) || 1)); draw(); };
  draw();
})();
</script>
</body>
</html>
