<style>
*{-webkit-tap-highlight-color:transparent;margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans','Inter','Noto Sans Ethiopic',sans-serif;background:#eef4f3;color:#1e293b}
.gradient-owner{background:linear-gradient(135deg,#ffffff 0%,#fffbeb 100%);border-bottom:1px solid #fcd34d}

.tag{padding:3px 10px;border-radius:999px;font-size:10px;font-weight:800}

<body>
<div class="phone">

<div class="gradient-owner p-4 pb-8">
  <div class="flex items-center justify-between mb-2">
    <span class="tag tag-amber">👑 OWNER</span>
    <a class="tag tag-amber" id="pub-link" href="#">🧊 Public 3D page</a>
    <button onclick="logoutKey()" class="tag tag-amber" title="Log out">🚪 Exit</button>
    <span class="tag tag-amber" id="month">—</span>
  </div>
  <div class="text-2xl font-black text-slate-800" id="bname">Loading…</div>
  <div class="text-xs text-amber-700 font-bold" id="bnameAm"></div>
</div>

<div class="flex gap-1 px-3 -mt-4 overflow-x-auto" id="tabbar" style="position:relative;z-index:5">
  <button onclick="setTab('overview')" data-t="overview" class="tabbtn on">📊 Overview</button>
  <button onclick="setTab('tenants')" data-t="tenants" class="tabbtn">🏬 Tenants</button>
  <button onclick="setTab('invoices')" data-t="invoices" class="tabbtn">🧾 Invoices</button>
  <button onclick="setTab('messages')" data-t="messages" class="tabbtn">📨 Messages</button>
  <button onclick="setTab('acct')" data-t="acct" class="tabbtn">💰 Accounting</button>
  <button onclick="setTab('meters')" data-t="meters" class="tabbtn">⚡ Meters</button>
  <button onclick="setTab('maint')" data-t="maint" class="tabbtn">🔧 Maintenance</button>
  <button onclick="setTab('leads')" data-t="leads" class="tabbtn">✨ Vacancies</button>
  <button onclick="setTab('ai')" data-t="ai" class="tabbtn">🤖 AI</button>
  <button onclick="setTab('settings')" data-t="settings" class="tabbtn">⚙️ Settings</button>
</div>
<div class="p-3 space-y-4" id="app">
  <div class="skel h-24"></div><div class="skel h-40"></div><div class="skel h-40"></div>
</div>

<div class="text-center text-[10px] text-slate-400 py-4">ቢ BinaSmart Owner Console</div>
</div>

<!-- PAY METHOD MODAL -->
<div id="pay-modal" class="modal">
  <div class="card p-5 w-full max-w-sm" style="max-width:340px">
    <div class="font-black text-lg mb-1">💰 How was it paid?</div>
    <div class="text-xs text-slate-500 mb-4" id="pay-label">—</div>
    <div class="space-y-2">
      <button class="paybtn" onclick="payWith('TELEBIRR')">📱 <span>telebirr</span></button>
      <button class="paybtn" onclick="payWith('CBE_BIRR')">🏦 <span>CBE Birr</span></button>
      <button class="paybtn" onclick="payWith('BANK_TRANSFER')">🏛️ <span>Bank transfer</span></button>
      <button class="paybtn" onclick="payWith('CASH')">💵 <span>Cash / ጥሬ ገንዘብ</span></button>
    </div>
    <button onclick="document.getElementById('pay-modal').classList.remove('open')" class="w-full bg-slate-200 text-slate-700 py-2.5 rounded-xl text-sm font-bold mt-3">Cancel</button>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
// Everything a person typed — a stranger on the public maintenance or lead form, a shop owner, the
// owner themselves — goes through one of these before it touches innerHTML. See test/owner-dashboard-escape.test.js.
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
// For a value inside onclick="fn('...')": escape for the JavaScript string first, then for the attribute.
function jsq(v) { return esc(String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, '\\n')); }
let KEY = params.get('key') || localStorage.getItem('bs_key') || '';
// The key unlocks every /api/owner route for this building, so it should not be in the query string:
// that writes it to the server's access log on every call. It travels as a header instead. Taking it
// out of the address bar was already handled a few lines below — params.delete('key') and
// replaceState, which correctly keeps any OTHER parameter; do not add a second copy of that here.
function kfetch(url, opts) {
  const o = Object.assign({}, opts || {});
  o.headers = Object.assign({}, o.headers || {}, { 'x-owner-key': KEY });
  return fetch(url, o);
}
if (params.get('key')) {
  localStorage.setItem('bs_key', params.get('key'));
  params.delete('key');
  history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
}
const slug = location.pathname.split('/').filter(Boolean).pop();
const fmtETB = n => n.toLocaleString() + ' ETB';
document.getElementById('pub-link').href = '/b/' + slug;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

async function load(){
  const r = await kfetch('/api/owner/' + slug + '/overview');
  if (r.status === 401) { // REDIR-TO-LOGIN
    localStorage.removeItem('bs_key'); KEY = '';
    const prefix = location.pathname.split('/owner/')[0];
    location.href = prefix + '/login';
    return;
  }
  const d = await r.json();
  await loadUnits();
  const now = new Date();
  document.getElementById('bname').textContent = d.building.name;
  document.getElementById('bnameAm').textContent = d.building.nameAm;
  document.getElementById('month').textContent = '📅 ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();

  const colPct = d.collection.invoiceCount ? Math.round(d.collection.paidCount / d.collection.invoiceCount * 100) : 0;
  const scanVals = Object.values(d.scansByDay);
  const scanMax = Math.max(1, ...scanVals);

  const unpaid = d.invoices.filter(i => i.status !== 'PAID');
  const paid = d.invoices.filter(i => i.status === 'PAID');

  D = d; renderTab();
}

let D = null, UNITS = [], TAB = 'overview';
function setTab(t){ TAB = t; document.querySelectorAll('.tabbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.t === t); }); renderTab(); }
async function loadUnits(){ UNITS = await (await kfetch('/api/owner/' + slug + '/units')).json(); }

let AI_MSGS = [];
function aiEsc(s){ return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function aiBubble(role, text, box){
  var d = document.createElement('div');
  d.className = role==='u' ? 'text-right' : 'text-left';
  d.innerHTML = '<span class="inline-block px-3 py-2 rounded-2xl text-sm '+(role==='u'?'bg-emerald-600 text-white':'bg-slate-100 text-slate-800')+'" style="max-width:85%;white-space:pre-wrap">'+aiEsc(text)+'</span>';
  box.appendChild(d);
}
function renderAI(){
  var app = document.getElementById('app');
  app.innerHTML =
    '<div class="card p-4">'
    + '<div class="font-black text-lg mb-1">🤖 Bini — Building Assistant</div>'
    + '<div class="text-xs text-slate-500 mb-3">ስለ ህንፃዎ ይጠይቁ · Ask about rent, vacancies, VAT, maintenance</div>'
    + '<div id="ai-msgs" class="space-y-2 mb-3" style="max-height:52vh;overflow-y:auto"></div>'
    + '<form id="ai-form" class="flex gap-2"><input id="ai-in" autocomplete="off" placeholder="ጠይቁ… how much rent is outstanding?" class="flex-1 border rounded-xl px-3 py-2 text-sm"><button class="bg-emerald-600 text-white rounded-xl px-4 text-sm font-bold">➤</button></form>'
    + '<div class="text-[10px] text-slate-400 mt-2">🔒 Answers use only THIS building\'s live data.</div>'
    + '</div>';
  var box = document.getElementById('ai-msgs');
  if (!AI_MSGS.length) AI_MSGS.push({r:'a', t:'ሰላም! ስለ ህንፃዎ ማንኛውንም ይጠይቁኝ — ኪራይ፣ ክፍት ክፍሎች፣ VAT፣ ጥገና።\nHi! Ask me anything about your building.'});
  AI_MSGS.forEach(function(m){ aiBubble(m.r, m.t, box); if (m.a) aiActionButtons(m.a, box, m); });
  box.scrollTop = box.scrollHeight;
  document.getElementById('ai-form').addEventListener('submit', function(e){ e.preventDefault(); ownerAiSend(); });
}
// An action Bini prepared: the buttons under the preview. Only the owner's press runs it, through the server's own
// checks (agents/owner/actions/service.js press) — this page decides nothing.
function aiActionButtons(action, box, msg){
  if (!action || !action.id || !(action.buttons || []).length) return;
  var row = document.createElement('div');
  row.className = 'flex gap-2 mt-1';
  action.buttons.forEach(function(b){
    var btn = document.createElement('button');
    btn.className = 'rounded-xl px-3 py-2 text-sm font-bold ' + (b.verb === 'cancel' ? 'bg-slate-200 text-slate-700' : b.verb === 'urgent' ? 'bg-amber-500 text-white' : 'bg-emerald-600 text-white');
    btn.textContent = b.label;
    btn.onclick = function(){ ownerActionPress(action.id, b.verb, row, msg); };
    row.appendChild(btn);
  });
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}
async function ownerActionPress(id, verb, row, msg){
  var box = document.getElementById('ai-msgs');
  Array.prototype.forEach.call(row.querySelectorAll('button'), function(b){ b.disabled = true; });
  if (msg) msg.a = null;
  try{
    var r = await kfetch('/api/owner/' + slug + '/actions/' + encodeURIComponent(id) + '/' + (verb === 'cancel' ? 'cancel' : 'confirm'),
      { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ urgent: verb === 'urgent' }) });
    var d = await r.json();
    row.remove();
    var text = (d && d.reply) || 'ይቅርታ።';
    var m = { r:'a', t:text, a:(d && d.ownerAction && (d.ownerAction.buttons || []).length) ? d.ownerAction : null };
    AI_MSGS.push(m); aiBubble('a', text, box);
    if (m.a) aiActionButtons(m.a, box, m);
    if (d && d.status === 'done') load();   // invoices, money and the activity log have changed
  }catch(e){ aiBubble('a','ይቅርታ፣ የግንኙነት ችግር።', box); }
  box.scrollTop = box.scrollHeight;
}
async function ownerAiSend(){
  var inp = document.getElementById('ai-in'); var q = inp.value.trim(); if(!q) return;
  var box = document.getElementById('ai-msgs');
  inp.value=''; AI_MSGS.push({r:'u',t:q}); aiBubble('u',q,box);
  var typing=document.createElement('div'); typing.className='text-left text-xs text-slate-400 px-1'; typing.textContent='ቢኒ እየጻፈ ነው…'; box.appendChild(typing); box.scrollTop=box.scrollHeight;
  try{
    var r = await kfetch('/api/owner/' + slug + '/ai', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:q})});
    var d = await r.json(); typing.remove();
    var rep = (d && d.reply) || 'ይቅርታ።';
    var m = { r:'a', t:rep, a:(d && d.ownerAction && (d.ownerAction.buttons || []).length) ? d.ownerAction : null };
    AI_MSGS.push(m); aiBubble('a',rep,box);
    if (m.a) aiActionButtons(m.a, box, m);
  }catch(e){ typing.remove(); aiBubble('a','ይቅርታ፣ የግንኙነት ችግር።',box); }
  box.scrollTop = box.scrollHeight;
}
function copyVatReturn(){
  if(!ACCT){ alert('Open the Accounting tab first.'); return; }
  var a=ACCT, v=a.vat;
  var txt=['BinaSmart — VAT Return (for eTax / etax.mor.gov.et)',
    'Period: '+a.month,
    'TIN: '+(a.tin||'-'),
    'VAT No: '+(v.number||'-'),
    'Taxable supplies: '+v.taxable+' ETB',
    'Output VAT (15%): '+v.outputVat+' ETB',
    'Input VAT (expenses): '+v.inputVat+' ETB',
    'Net VAT payable: '+v.netVat+' ETB',
    'File by: '+v.filingDue].join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ alert('✅ VAT return copied.\nPaste into etax.mor.gov.et to file.'); }, function(){ prompt('Copy your VAT return:', txt); });
  } else { prompt('Copy your VAT return:', txt); }
}
function renderTab(){
  if (TAB === 'ai') { return renderAI(); }
  if (TAB === 'messages') { return renderMessages(); }
  if (!D) return;
  const app = document.getElementById('app');
  const d = D;
  const colPct = d.collection.invoiceCount ? Math.round(d.collection.paidCount / d.collection.invoiceCount * 100) : 0;
  const scanVals = Object.values(d.scansByDay); const scanMax = Math.max(1, ...scanVals);
  const unpaid = d.invoices.filter(i => i.status !== 'PAID'); const paid = d.invoices.filter(i => i.status === 'PAID');

  if (TAB === 'overview'){
    app.innerHTML = `
    <div class="grid grid-cols-2 gap-2">
      <div class="card p-3"><div class="text-[10px] text-slate-400 font-bold">OCCUPANCY</div>
        <div class="text-2xl font-black text-emerald-600">${d.stats.occupancyPct}%</div>
        <div class="text-[10px] text-slate-400">${d.stats.occupied}/${d.stats.units} units • ${d.stats.vacant} vacant</div></div>
      <div class="card p-3"><div class="text-[10px] text-slate-400 font-bold">EXPECTED / MONTH</div>
        <div class="text-xl font-black text-amber-600">${fmtETB(d.stats.expectedMonthly)}</div></div>
      <div class="card p-3"><div class="text-[10px] text-slate-400 font-bold">QR SCANS (30D)</div>
        <div class="text-2xl font-black text-purple-600">${d.stats.qrScans30d}</div></div>
      <div class="card p-3"><div class="text-[10px] text-slate-400 font-bold">OPEN MAINTENANCE</div>
        <div class="text-2xl font-black ${d.stats.openMaintenance ? 'text-red-500' : 'text-slate-400'}">${d.stats.openMaintenance}</div></div>
    </div>
    <div class="card p-4">
      <div class="flex items-center justify-between mb-1"><div class="font-black text-sm text-slate-800">💰 Rent Collection</div>
        <span class="tag ${colPct >= 80 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${colPct}% collected</span></div>
      <div class="text-[11px] text-slate-500 mb-2">${d.collection.paidCount}/${d.collection.invoiceCount} invoices paid</div>
      <div class="bar mb-3"><div style="width:${colPct}%"></div></div>
      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="rounded-xl p-2" style="background:#ecfdf5;border:1px solid #a7f3d0"><div class="text-[9px] text-emerald-700 font-bold">COLLECTED</div>
          <div class="text-sm font-black text-emerald-600">${fmtETB(d.collection.collected)}</div></div>
        <div class="rounded-xl p-2" style="background:#fef2f2;border:1px solid #fecaca"><div class="text-[9px] text-red-600 font-bold">OUTSTANDING</div>
          <div class="text-sm font-black text-red-500">${fmtETB(d.collection.outstanding)}</div></div>
      </div>
    </div>

// fetched with the key in the header, like every other owner call, and written into a window opened on the click itself
// (before any await, so a popup blocker lets it through).
async function openTenantPoster(posterPath){
  if (!/^\/tenant-poster\/[A-Za-z0-9-]{1,60}$/.test(String(posterPath))) return;
  const w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups for this page to print the poster. / ፖስተሩን ለማተም ፖፕ-አፕ ይፍቀዱ'); return; }
  try { w.opener = null; } catch (e) {}
  w.document.write('<p style="font-family:sans-serif;padding:24px">Loading the poster… · በመጫን ላይ…</p>'); w.document.close();
  try {
    const r = await kfetch(posterPath);
    if (!r.ok) { w.close(); alert('❌ Could not open the poster (' + r.status + '). / ፖስተሩ አልተከፈተም'); return; }
    const html = await r.text();
    w.document.open(); w.document.write(html); w.document.close();
  } catch (e) { w.close(); alert('❌ Could not open the poster. Try again. / ፖስተሩ አልተከፈተም'); }
}

function msgCounts(c){

}
function batchPage(dir){ MSG.rpage = Math.max(0, (MSG.rpage || 0) + dir); openBatch(MSG.open, true); }
var MSG_ACT = { message: 'መልእክት · message', remind_unpaid: 'ማስታወሻ · reminders', send_invoice: 'ደረሰኝ ላክ · send invoice',
  create_invoices: 'ደረሰኞች አዘጋጅ · create invoices', record_payment: 'ክፍያ መዝግብ · record payment' };
var MSG_ST = { done: '✅ ተከናውኗል · done', failed: '⚠️ አልተሳካም · failed', refused: '⛔ አልተፈቀደም · refused',
  cancelled: '✖ ተሰርዟል · cancelled', expired: '⏱ ጊዜው አልፎበታል · expired', replaced: '🔄 ተቀይሯል · replaced',
  pending: '⏳ በመጠባበቅ · waiting', running: '⏳ በሂደት · running' };
var MSG_CH = { 'owner-telegram': 'Telegram', 'owner-web': 'dashboard' };
// What came of the actions the owner confirmed in the Bini chat, after that chat is closed (design §3.3). The server
// sends a role and a channel; there is no id here to press, and nothing that was in the preview card.
async function loadActions(){
  var box = document.getElementById('msg-actions'); if (!box) return;
  try{
    var r = await kfetch('/api/owner/' + slug + '/owner-actions?page=' + (MSG.apage || 0));
    if (!r.ok) { box.innerHTML = ''; return; }
    var d = await r.json();
    var rows = (d.actions || []).map(function(a){
      var c = a.counts, bits = [];
      if (c) bits.push('📤 ' + esc(c.sent) + ' · 🧪 ' + esc(c.test) + ' · ⚠️ ' + esc(c.failed) + ' · 📭 ' + esc(c.notReachable));
      if (a.created != null) bits.push('created ' + esc(a.created) + (a.skipped ? ', skipped ' + esc(a.skipped) : '')
        + (a.month ? ' · ' + esc(a.month) : ''));
      if (a.unit) bits.push('unit ' + esc(a.unit) + (a.totalEtb ? ' · ' + esc(a.totalEtb) + ' ETB' : ''));
      if (a.notReached && a.notReached.length) bits.push('not reached: ' + a.notReached.map(function(u){ return esc(u); }).join(', '));
      if (a.reason) bits.push('reason: ' + esc(a.reason));
      return '<div class="flex items-start gap-2 text-[11px] py-1.5 border-b" style="border-color:#e9f0ee"><span class="flex-1">'
        + '<b>' + esc(msgLabel(MSG_ACT, a.kind)) + '</b> · ' + esc(msgLabel(MSG_ST, a.status))
        + '<br><span class="text-[9px] text-slate-400">' + esc(String(a.confirmedAt || a.at).slice(0, 10))
        + ' · prepared by ' + esc(msgLabel(MSG_BY, a.preparedBy)) + ' · ' + esc(msgLabel(MSG_CH, a.channel))
        + (a.confirmedBy ? ' · confirmed by ' + esc(msgLabel(MSG_BY, a.confirmedBy)) : '')
        + (a.urgent ? ' · ⚠️ urgent' : '') + '</span>'
        + (bits.length ? '<br><span class="text-[10px]" style="color:#475569">' + bits.join(' · ') + '</span>' : '')
        + '</span></div>';
    }).join('');
    box.innerHTML = '<div class="font-black text-sm mb-1">✅ Actions you confirmed · ያረጋገጧቸው ትዕዛዞች (' + esc(d.total) + ')</div>'
      + '<div class="text-[10px] text-slate-500 mb-2">What Bini prepared and what came of it. · ቢኒ ያዘጋጀው እና ውጤቱ።</div>'
      + (rows || '<div class="text-xs text-slate-400">No actions yet · እስካሁን የለም</div>')
      + msgPager(d.page, d.pages, 'actPage');
  } catch (e) { box.innerHTML = ''; }
}
function actPage(dir){ MSG.apage = Math.max(0, (MSG.apage || 0) + dir); loadActions(); }
// Invoices whose send did not reach the tenant (messaging design §1.6). Send now uses the invoice as it is today.
async function loadPending(){
  const box = document.getElementById('pending-deliv'); if (!box) return;
  try {
    const r = await kfetch('/api/owner/' + slug + '/pending-deliveries'); if (!r.ok) { box.innerHTML = ''; return; }
    const d = await r.json();
    if (!d.invoices || !d.invoices.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="card p-4"><div class="font-black text-sm mb-1 text-amber-700">📭 Waiting to be delivered · ያልደረሱ (' + d.invoices.length + ')</div>'
      + '<div class="text-[10px] text-slate-500 mb-2">Sent before, but they did not reach the tenant. Send now uses the invoice as it is today. · አሁን ያለውን መረጃ ይልካል።</div>'
      + d.invoices.map(function (i) {
        return '<div class="flex items-center gap-2 text-[11px] py-1.5 border-b" style="border-color:#e9f0ee"><span class="flex-1"><b>' + esc(i.unit) + '</b> · ' + esc(i.type)
          + ' · ' + fmtETB(i.amount) + ' · due ' + esc(i.dueDate) + '<br><span class="text-[9px] text-slate-400">last try ' + esc(i.lastTry) + ' · ' + esc(i.reason) + '</span></span>'
          + '<button class="tag" style="background:#0088cc;color:#fff" onclick="sendInvoice(\'' + jsq(i.id) + '\',\'' + jsq(i.unit) + '\')">📤 Send now</button></div>';
      }).join('') + '</div>';
  } catch (e) { box.innerHTML = ''; }
}
async function vatSettings(){
  const reg = confirm('Is this building VAT-registered? OK = Yes, Cancel = No');
  let no = null;
  if (reg) no = prompt('VAT registration number (optional):', (ACCT && ACCT.vat.number) || '');
  await kfetch('/api/owner/' + slug + '/vat-settings', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ vatRegistered: reg, vatNumber: no, vatInclusive: true }) });
  ACCT = null; renderTab();
}
function filterTenants(){
  const q = document.getElementById('tsearch').value.toLowerCase();
  document.querySelectorAll('#tlist .mrow').forEach(function(r){ r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none'; });
}
async function editUnit(id){
  const u = UNITS.find(x => x.id === id);
  const name = prompt('Tenant / shop name:', u.tenant.nameAm || u.tenant.name); if (name === null) return;
  const phone = prompt('Phone:', u.tenant.phone); if (phone === null) return;
  const rent = prompt('Monthly rent (ETB):', u.monthlyRent); if (rent === null) return;
  await kfetch('/api/owner/' + slug + '/unit/' + id + '/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tenantName: name, tenantPhone: phone, rent: rent }) });
  await loadUnits(); renderTab();
}
async function vacateUnit(id, num){
  if (!confirm('⚠️ Mark unit ' + num + ' as VACANT?\nThe tenancy will be ended and the unit advertised for rent.\nክፍሉ ባዶ ይሆናል እና ለኪራይ ይተዋወቃል።')) return;
  const typed = prompt('🔒 To confirm, TYPE the unit number exactly:\nለማረጋገጥ የክፍሉን ቁጥር ይጻፉ: ' + num);
  if (typed === null) return;
  if (typed.trim() !== num){ alert('❌ Did not match — cancelled. / አልተዛመደም — ተሰርዟል'); return; }
  await kfetch('/api/owner/' + slug + '/unit/' + id + '/vacate', { method: 'POST' });
  alert('Unit ' + num + ' vacated. You can UNDO with the ↩️ Restore button. / በ↩️ መመለስ ይችላሉ');
  await loadUnits(); load();
}
async function addUnit(){
  const number = prompt('New unit number (e.g. 305 or G-07) / የክፍል ቁጥር:'); if (!number) return;
  const floor = prompt('Floor (0 = Ground) / ፎቅ:', '1'); if (floor === null) return;
  const rent = prompt('Monthly rent (ETB) / ወርሃዊ ኪራይ:', '0'); if (rent === null) return;
  const r = await (await kfetch('/api/owner/' + slug + '/add-unit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ number: number, floor: floor, rent: rent }) })).json();
  alert(r.ok ? '✓ Unit ' + number + ' created (vacant — use ➕ Add tenant to fill it)' : '❌ ' + (r.error === 'unit_number_exists' ? 'That unit number already exists' : r.error));
  await loadUnits(); renderTab();
}
async function addBuilding(){
  const name = prompt('🏢 New building name (English) / የህንፃው ስም:'); if (!name) return;
  const nameAm = prompt('Name in Amharic / በአማርኛ:', name) || name;
  const floors = prompt('Number of floors (G+? total) / ስንት ፎቅ:', '5'); if (!floors) return;
  const subCity = prompt('Area / Sub-city (e.g. Bole) / አካባቢ:') || '';
  if (!confirm('Create "' + name + '" (' + floors + ' floors, ' + (subCity || 'Addis Ababa') + ')?\nIt will appear on your login and on bina.et.')) return;
  const r = await (await kfetch('/api/owner/' + slug + '/add-building', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, nameAm: nameAm, floors: floors, subCity: subCity }) })).json();
  if (r.ok){
    alert('✅ ' + r.name + ' created!\n\n• Dashboard: bina.et/owner/' + r.slug + '\n• Its own access key: ' + r.key + '\n• It now appears when you login with your phone.\n\nNext: open it and use ➕ Unit to add its rooms.');
  } else alert('❌ ' + r.error);
}
async function restoreUnit(id, num){
  if (!confirm('↩️ Restore the previous tenant to unit ' + num + '? / የቀድሞውን ተከራይ መመለስ?')) return;
  const r = await (await kfetch('/api/owner/' + slug + '/unit/' + id + '/restore', { method: 'POST' })).json();
  alert(r.ok ? '✓ Restored: ' + r.restored : '❌ ' + (r.error === 'no_previous_tenant' ? 'No previous tenant on this unit' : r.error));
  await loadUnits(); load();
}
async function occupyUnit(id, num){
  const name = prompt('New tenant name for ' + num + ':'); if (!name) return;
  const phone = prompt('Tenant phone (09… / +2519…):'); if (!phone) return;
  const rent = prompt('Monthly rent (ETB):'); if (rent === null) return;
  await kfetch('/api/owner/' + slug + '/unit/' + id + '/occupy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, phone: phone, rent: rent }) });
  await loadUnits(); load();
}
async function unpayInvoice(id, label){
  if (!confirm('↩️ UNDO payment for ' + label + '?\nThe invoice will go back to UNPAID. / ክፍያው ይሰረዝና ወደ ያልተከፈለ ይመለሳል')) return;
  const typed = prompt('Type UNDO to confirm / ለማረጋገጥ UNDO ብለው ይጻፉ:');
  if ((typed || '').trim().toUpperCase() !== 'UNDO') { alert('Cancelled — nothing changed.'); return; }
  const r = await (await kfetch('/api/owner/' + slug + '/invoice/' + id + '/unpay', { method: 'POST' })).json();
  if (r.ok) { alert('✅ Reverted to ' + r.status); DATA = null; load(); } else alert('❌ ' + r.error);
}
async function sendInvoice(id, unit){
  if (!confirm('📤 Send this invoice to the tenant of ' + unit + ' by Telegram (or SMS once it is switched on)? / ደረሰኙን ለተከራዩ ይላክ?')) return;
  const r = await (await kfetch('/api/owner/' + slug + '/invoice/' + id + '/send', { method: 'POST' })).json();
  if (!r.ok) { alert('❌ ' + r.error); return; }
  // Telegram refusing (the tenant blocked or left the bot) is said first, whatever happened after it.
  const tgNote = r.reason === 'tg_failed' ? '⚠️ Telegram failed — the tenant\'s Telegram did not accept the message (they may have blocked or left the bot). / ቴሌግራም አልደረሰም\n\n' : '';
  alert(tgNote + (r.delivered ? '✅ Sent by ' + (r.channel === 'sms' ? 'SMS' : 'Telegram') + ' / ተልኳል'
    : r.status === 'test' ? '🧪 Test mode — recorded only, NOT delivered: the tenant did not receive it (SMS is not switched on yet). It stays under "Waiting to be delivered". / የሙከራ ሁኔታ — ተመዝግቧል፣ ለተከራዩ አልደረሰም'
    : '⚠️ NOT delivered (' + String(r.reason || 'not reachable').replace(/[^A-Za-z0-9_ ]/g, '') + '): the tenant did not receive it. There is no working Telegram link for this tenant and SMS is not switched on yet. It stays under "Waiting to be delivered". / አልደረሰም'));
  loadPending();
}
async function genInvoices(){
  if (!confirm('Generate this month\'s invoices for all occupied units?')) return;
  const r = await (await kfetch('/api/admin/' + slug + '/generate-invoices', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })).json();
  alert('Created: ' + r.created + ', already existed: ' + r.skipped);
  load();
}


function loginKey(){
  const v = document.getElementById('key-in').value.trim();
  if (!v) return;
  KEY = v; localStorage.setItem('bs_key', v);
  document.getElementById('app').innerHTML = '<div class="skel h-24"></div><div class="skel h-40"></div>';
  load();
}
function logoutKey(){
  localStorage.removeItem('bs_key'); KEY = '';
  location.reload();
}

const MAINT_ICON = { PLUMBING:'🚿', ELECTRIC:'💡', LIFT:'🛗', CLEANING:'🧹', SECURITY:'🛡️', GENERAL:'🔧' };
async function setMaint(id, status){
  const r = await kfetch('/api/admin/maintenance/' + id + '/status', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  });
  if ((await r.json()).ok) load();
}

let payInvoiceId = null;
function markPaid(id, label){
  payInvoiceId = id;
  document.getElementById('pay-label').textContent = label || 'Select the payment method';
  document.getElementById('pay-modal').classList.add('open');
}
async function payWith(method){
  const r = await kfetch('/api/admin/invoices/' + payInvoiceId + '/pay', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ method })
  });
  document.getElementById('pay-modal').classList.remove('open');
  const d = await r.json().catch(() => ({}));
  if (d.ok) { load(); return; }
  // A second tap or a stale list: the server refuses a second payment and sends no second receipt. Say so, show the list as it is.
  if (r.status === 409 && d.error === 'already_paid') {
    alert('ℹ️ This invoice is already marked paid — nothing changed and no second receipt was sent. / ይህ የክፍያ መጠየቂያ ቀድሞ እንደተከፈለ ተመዝግቧል፤ ምንም አልተቀየረም።');
    DATA = null; load();
  }
}

load();
</script>
