graphhopper:
  graph.encoded_values: car_access, car_average_speed
  graph.dataaccess.default_type: RAM_STORE
  routing.max_visited_nodes: 1000000
  datareader.file: /root/routing/ethiopia-latest.osm.pbf
  graph.location: /root/routing/graph-cache
  profiles:
    - name: car
      custom_model_files: [car.json]
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
  profiles_ch:
    - profile: car
  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
logging:
  level: INFO
